       :root {

           --text-main: #3C4043;
           --text-muted: #8392A5;
           --surface: #FFFFFF;
           --border-color: #E2E8F0;
           
           --primary-color: #1CB0F6;
           --primary-shadow: #1899D6;
           
           --correct-bg: #E8F5E9;
           --correct-color: #2E7D32;
           --correct-shadow: #1B5E20;
           
           --wrong-bg: #FFEBEE;
           --wrong-color: #C62828;
           --wrong-shadow: #8E0000;
           
           --accent-yellow: #FFC800;
           --accent-yellow-shadow: #E5B200;
       }

       * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
           user-select: none;
           -webkit-tap-highlight-color: transparent;
       }

       body {
           font-family: 'Nunito', sans-serif;
           background-color: var(--bg-color);
           color: var(--text-main);
           display: flex;
           flex-direction: column;
           height: 100vh;
           height: 100dvh;
           overflow: hidden;
       }

       /* HEADER */
       header {
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding: 12px 16px;
           background-color: var(--surface);
           border-bottom: 2px solid var(--border-color);
           z-index: 10;
       }

       .header-left, .header-right {
           display: flex;
           align-items: center;
           gap: 8px;
       }

       .btn-icon {
           background: var(--surface);
           border: 2px solid var(--border-color);
           border-bottom-width: 4px;
           color: var(--text-muted);
           font-size: 1.1rem;
           cursor: pointer;
           width: 42px;
           height: 42px;
           border-radius: 12px;
           display: flex;
           align-items: center;
           justify-content: center;
           transition: all 0.1s;
       }
       .btn-icon:active {
           border-bottom-width: 2px;
           transform: translateY(2px);
       }
       .btn-icon.active {
           color: var(--primary-color);
           border-color: var(--primary-color);
       }

       .timer-badge {
           background-color: #FFF3E0;
           color: #E65100;
           border: 2px solid #FFE0B2;
           padding: 6px 12px;
           border-radius: 12px;
           font-weight: 900;
           font-size: 0.95rem;
           display: flex;
           align-items: center;
           gap: 6px;
       }

       .stats {
           display: flex;
           gap: 12px;
           font-size: 1.1rem;
           font-weight: 900;
       }
       .stat-item.correct { color: #4CAF50; }
       .stat-item.wrong { color: #F44336; }

       /* CONTROL PANEL (Difficulty & Mode) */
       .control-bar {
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding: 10px 16px;
           background-color: var(--surface);
           border-bottom: 1px solid var(--border-color);
       }

       .select-custom {
           background: var(--bg-color);
           border: 2px solid var(--border-color);
           border-radius: 10px;
           padding: 6px 10px;
           font-family: inherit;
           font-weight: 800;
           color: var(--text-main);
           outline: none;
           font-size: 0.85rem;
       }

       .btn-marathon {
           background: var(--accent-yellow);
           border: none;
           border-bottom: 3px solid var(--accent-yellow-shadow);
           color: #4A3B00;
           padding: 6px 12px;
           border-radius: 10px;
           font-weight: 900;
           font-size: 0.85rem;
           cursor: pointer;
           display: flex;
           align-items: center;
           gap: 6px;
       }
       .btn-marathon:active {
           border-bottom-width: 1px;
           transform: translateY(2px);
       }

       /* MAIN CONTAINER */
       main {
           flex: 1;
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
           padding: 20px;
           text-align: center;
           padding-bottom: 220px; 
       }

       .question-title {
           font-size: 1.6rem;
           font-weight: 900;
           margin-bottom: 4px;
       }

       .subtitle {
           font-size: 0.95rem;
           color: var(--text-muted);
           font-weight: 700;
           margin-bottom: 20px;
       }

       .feedback-box {
           min-height: 80px;
           width: 100%;
           max-width: 400px;
           border-radius: 16px;
           padding: 12px 16px;
           font-size: 1.1rem;
           font-weight: 900;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           opacity: 0;
           transform: scale(0.95);
           transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
           pointer-events: none;
       }
       .feedback-box.show {
           opacity: 1;
           transform: scale(1);
       }
       .feedback-box.correct {
           background-color: var(--correct-bg);
           color: var(--correct-shadow);
           border: 2px solid #A5D6A7;
       }
       .feedback-box.wrong {
           background-color: var(--wrong-bg);
           color: var(--wrong-shadow);
           border: 2px solid #EF9A9A;
       }

       /* BOTTOM ANCHORED BUTTONS (ONE-HANDED FRIENDLY) */
       .action-area {
           position: fixed;
           bottom: 0;
           left: 50%;
           transform: translateX(-50%);
           width: 100%;
           max-width: 480px;
           padding: 16px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
           background: linear-gradient(to top, var(--bg-color) 85%, transparent);
           display: flex;
           flex-direction: column;
           gap: 12px;
           z-index: 5;
       }

       .btn-choice {
           background-color: var(--surface);
           color: var(--primary-color);
           border: 2px solid var(--border-color);
           border-bottom: 6px solid var(--border-color);
           border-radius: 16px;
           padding: 18px;
           font-size: 1.3rem;
           font-family: inherit;
           font-weight: 900;
           cursor: pointer;
           transition: all 0.08s ease-in-out;
           width: 100%;
           text-align: center;
           box-shadow: 0 4px 6px rgba(0,0,0,0.02);
       }
       .btn-choice:active {
           border-bottom-width: 2px;
           transform: translateY(4px);
       }
       .btn-choice.correct-click {
           background-color: var(--correct-bg);
           color: var(--correct-color);
           border-color: #81C784;
           border-bottom-color: var(--correct-shadow);
       }
       .btn-choice.wrong-click {
           background-color: var(--wrong-bg);
           color: var(--wrong-color);
           border-color: #E57373;
           border-bottom-color: var(--wrong-shadow);
       }

       /* MODAL STYLES */
       .modal-overlay {
           position: fixed;
           top: 0; left: 0; width: 100%; height: 100%;
           background: rgba(0,0,0,0.5);
           display: flex;
           justify-content: center;
           align-items: flex-end;
           z-index: 100;
           opacity: 0;
           pointer-events: none;
           transition: opacity 0.25s ease;
       }
       .modal-overlay.active {
           opacity: 1;
           pointer-events: auto;
       }
       .modal-card {
           background: var(--surface);
           width: 100%;
           max-width: 480px;
           max-height: 82vh;
           border-top-left-radius: 24px;
           border-top-right-radius: 24px;
           padding: 24px;
           display: flex;
           flex-direction: column;
           transform: translateY(100%);
           transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
       }
       .modal-overlay.active .modal-card {
           transform: translateY(0);
       }

       .modal-header {
           display: flex;
           justify-content: space-between;
           align-items: center;
           margin-bottom: 16px;
       }
       .modal-header h2 { font-size: 1.3rem; font-weight: 900; }

           flex: 1;
           overflow-y: auto;
           display: flex;
           flex-direction: column;
           gap: 10px;
           padding-right: 4px;

           align-items: center;

           background-color: var(--bg-color);

           font-size: 0.8rem;

       }

       .modal-footer {

           gap: 10px;

           border-radius: 12px;
           font-family: inherit;

           border: none;
           cursor: pointer;
           display: flex;
           align-items: center;
           justify-content: center;
           gap: 6px;
       }
       .btn-share { background-color: var(--primary-color); color: white; }
       .btn-reset { background-color: var(--wrong-bg); color: var(--wrong-color); }

</head>

       // ELEMENT REFERENCES
       const btn1 = document.getElementById('btn-1');
       const btn2 = document.getElementById('btn-2');
       const correctStat = document.getElementById('correct-count');
       const wrongStat = document.getElementById('wrong-count');
       const feedbackEl = document.getElementById('feedback');
       const soundBtn = document.getElementById('btn-sound');
       const historyBtn = document.getElementById('btn-history');
       const modal = document.getElementById('modal-overlay');
       const closeModalBtn = document.getElementById('btn-close-modal');
       const resetHistoryBtn = document.getElementById('btn-reset-history');
       const shareResultBtn = document.getElementById('btn-share-result');
       const modalBodyContent = document.getElementById('modal-body-content');
       const modalTitle = document.getElementById('modal-title');
       const difficultySelect = document.getElementById('difficulty-select');
       const marathonBtn = document.getElementById('btn-marathon-toggle');
       const marathonLabel = document.getElementById('marathon-label');
       const timerContainer = document.getElementById('timer-container');
       const timerText = document.getElementById('timer-text');

       // STATE VARIABLES
       let currentItem = null;
       let correctCount = 0;
       let wrongCount = 0;
       let soundEnabled = true;
       let isAnimating = false;
       
       // MARATHON TIMER STATE
       let isMarathonMode = false;
       let marathonTimer = null;
       let timerSeconds = 600; // 10 Menit

       // WEB AUDIO SYNTHESIS FOR AUDIO FEEDBACK
       const AudioCtx = window.AudioContext || window.webkitAudioContext;
       let audioCtx = null;

       function initAudio() {
           if (!audioCtx) audioCtx = new AudioCtx();
       }

       function playSound(isCorrect) {
           if (!soundEnabled) return;
           initAudio();
           if (audioCtx.state === 'suspended') audioCtx.resume();

           const osc = audioCtx.createOscillator();
           const gain = audioCtx.createGain();
           osc.connect(gain);
           gain.connect(audioCtx.destination);

           if (isCorrect) {
               osc.type = 'sine';
               osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
               osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
               gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
               gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
               osc.start();
               osc.stop(audioCtx.currentTime + 0.3);
           } else {
               osc.type = 'sawtooth';
               osc.frequency.setValueAtTime(150, audioCtx.currentTime);
               osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
               gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
               gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
               osc.start();
               osc.stop(audioCtx.currentTime + 0.35);
           }
       }

       // LOCAL STORAGE - SPACED REPETITION ENGINE
       function getErrorHistory() {
           const data = localStorage.getItem('kataBaku_errors');
           return data ? JSON.parse(data) : {};
       }

       function recordError(item) {
           const history = getErrorHistory();
           if (history[item.baku]) {
               history[item.baku].count += 1;
           } else {
               history[item.baku] = {
                   baku: item.baku,
                   tidakBaku: item.tidakBaku,
                   count: 1
               };
           }
           localStorage.setItem('kataBaku_errors', JSON.stringify(history));
       }

       // GET FILTERED DATASET BASED ON DIFFICULTY
       function getFilteredDataset() {
           const diff = difficultySelect.value;
           if (diff === 'all') return wordDatabase;
           return wordDatabase.filter(w => w.level === diff);
       }

       // QUESTION GENERATOR (SPACED REPETITION ENHANCED)
       function nextQuestion() {
           const dataset = getFilteredDataset();
           const history = getErrorHistory();
           const errKeys = Object.keys(history);

           // 35% Chance to pull from previously failed words (if applicable)
           let selectedItem = null;
           if (errKeys.length > 0 && Math.random() < 0.35) {
               const randomErrKey = errKeys[Math.floor(Math.random() * errKeys.length)];
               selectedItem = wordDatabase.find(w => w.baku === randomErrKey);
           }

           if (!selectedItem || (difficultySelect.value !== 'all' && selectedItem.level !== difficultySelect.value)) {
               selectedItem = dataset[Math.floor(Math.random() * dataset.length)];
           }

           // Mencegah soal persis sama muncul 2x berturut-turut
           if (currentItem && selectedItem.baku === currentItem.baku && dataset.length > 1) {
               return nextQuestion();
           }

           currentItem = selectedItem;

           // Randomize position A or B
           const isBakuBtn1 = Math.random() < 0.5;
           btn1.textContent = isBakuBtn1 ? currentItem.baku : currentItem.tidakBaku;
           btn2.textContent = isBakuBtn1 ? currentItem.tidakBaku : currentItem.baku;

           btn1.className = 'btn-choice';
           btn2.className = 'btn-choice';
           isAnimating = false;
       }

       // ANSWER HANDLER
       function handleAnswer(e) {
           if (isAnimating) return;
           isAnimating = true;

           const selectedBtn = e.currentTarget;
           const chosenWord = selectedBtn.textContent;
           const isCorrect = (chosenWord === currentItem.baku);

           if (isCorrect) {
               selectedBtn.classList.add('correct-click');
               correctCount++;
               correctStat.textContent = correctCount;
               feedbackEl.textContent = "Tepat Sekali!";
               feedbackEl.className = "feedback-box show correct";
               playSound(true);
           } else {
               selectedBtn.classList.add('wrong-click');
               wrongCount++;
               wrongStat.textContent = wrongCount;
               recordError(currentItem);

               feedbackEl.innerHTML = `Kurang Tepat!<br>Yang Baku: <b>${currentItem.baku}</b>`;
               feedbackEl.className = "feedback-box show wrong";
               playSound(false);
           }

           setTimeout(() => {
               feedbackEl.classList.remove('show');
               setTimeout(nextQuestion, 120);
           }, 1000);
       }

       // MARATHON TIMER LOGIC
       function toggleMarathon() {
           if (isMarathonMode) {
               stopMarathon();
           } else {
               startMarathon();
           }
       }

       function startMarathon() {
           isMarathonMode = true;
           timerSeconds = 600; // 10 menit
           correctCount = 0;
           wrongCount = 0;
           correctStat.textContent = '0';
           wrongStat.textContent = '0';
           
           marathonLabel.textContent = "Hentikan Marathon";
           timerContainer.style.display = 'flex';
           updateTimerDisplay();

           marathonTimer = setInterval(() => {
               timerSeconds--;
               updateTimerDisplay();
               if (timerSeconds <= 0) {
                   stopMarathon();
                   showMarathonFinishedModal();
               }
           }, 1000);

           nextQuestion();
       }

       function stopMarathon() {
           isMarathonMode = false;
           clearInterval(marathonTimer);
           timerContainer.style.display = 'none';
           marathonLabel.textContent = "Mulai Marathon 10M";
       }

       function updateTimerDisplay() {
           const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
           const s = (timerSeconds % 60).toString().padStart(2, '0');
           timerText.textContent = `${m}:${s}`;
       }

       // MODAL & SHARE RESULT
       function showHistoryModal() {
           modalTitle.textContent = "Riwayat Kata Sering Salah";
           const history = getErrorHistory();
           const items = Object.values(history).sort((a,b) => b.count - a.count);

           if (items.length === 0) {
               modalBodyContent.innerHTML = `<div style="text-align:center; padding: 30px 0; color: var(--text-muted); font-weight:800;">Belum ada kata yang salah. Luar biasa!</div>`;
           } else {
               let html = '';
               items.forEach(item => {
                   html += `
                       <div class="history-item">
                           <div class="history-pair">
                               <span class="word-baku-text">${item.baku}</span>
                               <span class="word-tidak-baku-text">${item.tidakBaku}</span>
                           </div>
                           <span class="err-count-tag">Salah ${item.count}x</span>
                       </div>
                   `;
               });
               modalBodyContent.innerHTML = html;
           }
           modal.classList.add('active');
       }

       function showMarathonFinishedModal() {
           modalTitle.textContent = "Marathon 10 Menit Selesai!";
           const total = correctCount + wrongCount;
           const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;

           modalBodyContent.innerHTML = `
               <div style="text-align: center; padding: 20px 0;">
                   <div style="font-size: 3rem; color: var(--primary-color); font-weight: 900;">${correctCount}</div>
                   <div style="font-size: 1.1rem; font-weight: 800; color: var(--text-muted);">Kata Baku Dikuasai</div>
                   <div style="margin-top: 16px; font-weight: 800; font-size: 1rem;">
                       Akurasi: <span style="color:var(--correct-color);">{correctCount} Benar / ${wrongCount} Salah)
                   </div>
               </div>
           `;
           modal.classList.add('active');
       }

       function shareResults() {
           const total = correctCount + wrongCount;
           const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
           const text = `🏆 Hasil Kuis Kata Baku KBBI:\n` +
                        `✅ Benar: ${correctCount}\n` +
                        `❌ Salah: ${wrongCount}\n` +
                        `🎯 Akurasi: ${accuracy}%\n` +
                        `⚡ Mode: ${isMarathonMode ? 'Marathon 10 Menit' : 'Latihan Bebas'}\n\n` +
                        `Asah pemahaman Bahasa Indonesia kamu sekarang!`;

           if (navigator.share) {
               navigator.share({ title: 'Hasil Kuis Kata Baku', text: text }).catch(() => {});
           } else {
               navigator.clipboard.writeText(text).then(() => {
                   alert('Hasil kuis berhasil disalin ke clipboard!');
               });
           }
       }

       // EVENT LISTENERS
       btn1.addEventListener('click', handleAnswer);
       btn2.addEventListener('click', handleAnswer);
       soundBtn.addEventListener('click', () => {
           soundEnabled = !soundEnabled;
           soundBtn.classList.toggle('active', soundEnabled);
           soundBtn.querySelector('i').className = soundEnabled ? 'fa-solid fa-volume-up' : 'fa-solid fa-volume-xmark';
       });
       historyBtn.addEventListener('click', showHistoryModal);
       closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
       modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
       resetHistoryBtn.addEventListener('click', () => {
           if (confirm('Hapus seluruh riwayat kata yang pernah salah?')) {
               localStorage.removeItem('kataBaku_errors');
               showHistoryModal();
           }
       });
       shareResultBtn.addEventListener('click', shareResults);
       difficultySelect.addEventListener('change', nextQuestion);
       marathonBtn.addEventListener('click', toggleMarathon);

       // INITIALIZE
       nextQuestion();
   </script>
