 <head>

  <title>WOIPS Platform</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
:root{
--pri:#F97316;--sec:#58CC02;--blu:#1CB0F6;--yel:#FFC800;--pur:#CE82FF;
--bg:#FFF8F0;--card:#FFFFFF;--text:#2D3436;--text2:#636E72;--radius:1rem;
}
*{font-family:'Nunito',sans-serif;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,var(--pri),#FF8C42);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:10}
.header h1{font-size:1.4rem;font-weight:900;color:#fff;margin:0;letter-spacing:1px}
.header .logo-icon{width:36px;height:36px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:900;color:var(--pri);margin-right:10px;border-bottom:3px solid rgba(0,0,0,.15)}
.header-left{display:flex;align-items:center}
.gear-btn{background:rgba(255,255,255,.25);border:none;color:#fff;width:40px;height:40px;border-radius:12px;font-size:1.2rem;cursor:pointer;border-bottom:3px solid rgba(0,0,0,.15);transition:.15s}
.gear-btn:active{transform:translateY(2px);border-bottom-width:1px}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}
.page{display:none}
.page.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:100;border-top:2px solid #f0f0f0}
.nav-item{display:flex;flex-direction:column;align-items:center;padding:6px 8px;cursor:pointer;border-radius:12px;transition:.2s;font-size:.65rem;font-weight:700;color:var(--text2);min-width:56px;border:none;background:none}
.nav-item i{font-size:1.3rem;margin-bottom:2px;transition:.2s}
.nav-item.active{color:var(--pri)}
.nav-item.active i{transform:scale(1.15)}
.nav-item[data-page="notes"].active{color:var(--pri)}
.nav-item[data-page="reels"].active{color:#E91E63}
.nav-item[data-page="maps"].active{color:var(--blu)}
.nav-item[data-page="pedia"].active{color:var(--sec)}
.nav-item[data-page="pict"].active{color:var(--pur)}
.search-bar{position:relative;margin-bottom:12px}
.search-bar input{width:100%;padding:12px 16px 12px 44px;border:2px solid #e8e8e8;border-radius:var(--radius);font-size:.9rem;font-weight:600;background:#fff;transition:.2s;border-bottom:4px solid #e0e0e0}
.search-bar input:focus{outline:none;border-color:var(--pri);border-bottom-color:var(--pri);box-shadow:0 4px 12px rgba(249,115,22,.15)}
.search-bar .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:1.1rem}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none;-ms-overflow-style:none}
.filter-row::-webkit-scrollbar{display:none}
.pill{padding:6px 16px;border-radius:50px;font-size:.78rem;font-weight:700;border:2px solid #e0e0e0;background:#fff;cursor:pointer;white-space:nowrap;transition:.2s;border-bottom:3px solid #d0d0d0;color:var(--text2)}
.pill:active{transform:translateY(2px);border-bottom-width:1px}
.pill.active{background:var(--pri);color:#fff;border-color:var(--pri);border-bottom-color:#c05d10}
.stats-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stat-chip{background:linear-gradient(135deg,var(--pri),#FF8C42);color:#fff;padding:4px 12px;border-radius:50px;font-size:.72rem;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.stat-chip i{font-size:.8rem}
.card-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:576px){.card-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:992px){.card-grid{grid-template-columns:repeat(3,1fr)}}
.item-card{background:#fff;border-radius:var(--radius);padding:14px;cursor:pointer;transition:.2s;border:2px solid #f0f0f0;border-bottom:4px solid #e0e0e0;position:relative;overflow:hidden}
.item-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.item-card:active{transform:translateY(1px);border-bottom-width:2px}
.item-card .cat-line{position:absolute;bottom:0;left:0;right:0;height:4px}
.item-card .emoji-big{font-size:2rem;margin-bottom:4px}
.item-card h3{font-size:.9rem;font-weight:800;margin:0 0 4px;line-height:1.3}
.item-card p{font-size:.75rem;color:var(--text2);margin:0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-card .card-meta{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.item-card .tag{font-size:.65rem;padding:2px 8px;border-radius:50px;font-weight:700}
.item-card .actions-row{display:flex;gap:6px;margin-top:8px;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:10px;border:2px solid #e8e8e8;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;transition:.15s;border-bottom:3px solid #d8d8d8;color:var(--text2)}
.icon-btn:active{transform:translateY(2px);border-bottom-width:1px}
.icon-btn.bookmarked{color:var(--yel);border-color:var(--yel)}
.icon-btn.pinned{color:var(--pri);border-color:var(--pri)}
.fab{position:fixed;bottom:80px;right:16px;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--pri),#FF8C42);color:#fff;border:none;font-size:1.8rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:90;box-shadow:0 6px 20px rgba(249,115,22,.4);border-bottom:4px solid #c05d10;transition:.2s}
.fab:active{transform:translateY(3px);border-bottom-width:1px}
.modal-custom .modal-content{border-radius:1.5rem;border:2px solid #f0f0f0;border-bottom:4px solid #e0e0e0;overflow:hidden}
.modal-custom .modal-header{background:linear-gradient(135deg,var(--pri),#FF8C42);color:#fff;border:none;padding:16px 20px}
.modal-custom .modal-title{font-weight:800;font-size:1.1rem}
.modal-custom .modal-body{padding:20px}
.modal-custom .btn-close{filter:invert(1)}
.btn-3d{padding:10px 20px;border-radius:var(--radius);font-weight:700;font-size:.85rem;border:none;cursor:pointer;transition:.15s;border-bottom:4px solid rgba(0,0,0,.2);display:inline-flex;align-items:center;gap:6px}
.btn-3d:active{transform:translateY(3px);border-bottom-width:1px}
.btn-pri{background:var(--pri);color:#fff}
.btn-sec{background:var(--sec);color:#fff}
.btn-blu{background:var(--blu);color:#fff}
.btn-danger{background:#FF4757;color:#fff}
.btn-outline{background:#fff;color:var(--text);border:2px solid #e0e0e0;border-bottom:4px solid #d0d0d0}
.form-control,.form-select{border-radius:var(--radius);border:2px solid #e0e0e0;font-weight:600;border-bottom:4px solid #d0d0d0;padding:10px 14px;font-size:.85rem}
.form-control:focus,.form-select:focus{border-color:var(--pri);box-shadow:0 4px 12px rgba(249,115,22,.1)}
.progress-bar-custom{height:8px;background:#e8e8e8;border-radius:50px;overflow:hidden;margin-top:6px}
.progress-bar-custom .fill{height:100%;background:linear-gradient(90deg,var(--sec),#7ED957);border-radius:50px;transition:width .5s}
.highlight-box{background:linear-gradient(135deg,#FFF3E0,#FFF8F0);border-left:4px solid var(--pri);padding:12px;border-radius:0 var(--radius) var(--radius) 0;margin:12px 0;font-size:.82rem;line-height:1.5}
.masonry{columns:2;column-gap:12px}
@media(min-width:768px){.masonry{columns:3}}
.masonry .pict-card{break-inside:avoid;margin-bottom:12px;border-radius:var(--radius);overflow:hidden;background:#fff;border:2px solid #f0f0f0;border-bottom:4px solid #e0e0e0;cursor:pointer;transition:.2s}
.masonry .pict-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.masonry .pict-card img{width:100%;display:block}
.masonry .pict-card .info{padding:10px}
.masonry .pict-card h4{font-size:.8rem;font-weight:800;margin:0 0 2px}
.masonry .pict-card .cat{font-size:.65rem;color:var(--text2);font-weight:600}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:none;align-items:center;justify-content:center;flex-direction:column}
.lightbox.show{display:flex}
.lightbox img{max-width:90%;max-height:70%;object-fit:contain;border-radius:var(--radius);transition:transform .3s}
.lightbox img.zoomed{transform:scale(1.8)}
.lightbox .lb-close{position:absolute;top:16px;right:16px;color:#fff;font-size:1.8rem;cursor:pointer;background:rgba(255,255,255,.15);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:none}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:2rem;cursor:pointer;background:rgba(255,255,255,.15);width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:none}
.lightbox .lb-prev{left:12px}
.lightbox .lb-next{right:12px}
.lightbox .lb-info{color:#fff;text-align:center;margin-top:16px;max-width:80%}
.lightbox .lb-info h4{font-weight:800;font-size:1rem;margin:0 0 4px}
.lightbox .lb-info p{font-size:.8rem;opacity:.8;margin:0}
.lightbox .lb-download{margin-top:10px;background:var(--pri);color:#fff;border:none;padding:8px 20px;border-radius:50px;font-weight:700;font-size:.8rem;cursor:pointer;border-bottom:3px solid #c05d10}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1500;display:none;backdrop-filter:blur(4px)}
.sidebar-overlay.show{display:block}
.sidebar-panel{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#fff;z-index:1600;transition:right .3s;padding:20px;overflow-y:auto;border-left:2px solid #f0f0f0}
.sidebar-panel.show{right:0}
.sidebar-panel h3{font-weight:900;font-size:1.1rem;margin-bottom:20px;color:var(--pri)}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius);cursor:pointer;transition:.15s;font-weight:700;font-size:.85rem;color:var(--text);border:2px solid #f0f0f0;border-bottom:3px solid #e0e0e0;margin-bottom:8px;background:#fff}
.sidebar-item:hover{background:#FFF3E0}
.sidebar-item:active{transform:translateY(2px);border-bottom-width:1px}
.sidebar-item i{font-size:1.2rem;color:var(--pri);width:24px;text-align:center}
.maps-card{background:#fff;border-radius:var(--radius);padding:14px;border:2px solid #f0f0f0;border-bottom:4px solid #e0e0e0;margin-bottom:10px;transition:.2s}
.maps-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}
.maps-card .top-row{display:flex;align-items:flex-start;gap:10px}
.maps-card .check-box{width:28px;height:28px;border:3px solid #d0d0d0;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;background:#fff;margin-top:2px}
.maps-card .check-box.done{background:var(--sec);border-color:var(--sec);color:#fff}
.maps-card .info{flex:1;min-width:0}
.maps-card h3{font-size:.88rem;font-weight:800;margin:0 0 4px}
.maps-card.done-card h3{text-decoration:line-through;opacity:.6}
.maps-card .deadline{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:50px;display:inline-block}
.maps-card .deadline.overdue{background:#FFE0E0;color:#FF4757}
.maps-card .deadline.ok{background:#E0F7E0;color:#27AE60}
.pedia-card{background:#fff;border-radius:var(--radius);padding:14px;border:2px solid #f0f0f0;border-bottom:4px solid #e0e0e0;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}
.pedia-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}
.pedia-card .emoji{font-size:1.8rem;flex-shrink:0}
.pedia-card .info{flex:1;min-width:0}
.pedia-card h3{font-size:.85rem;font-weight:800;margin:0 0 2px}
.pedia-card .sub{font-size:.7rem;color:var(--text2);font-weight:600}
.check-input{display:none}
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-state i{font-size:3rem;margin-bottom:12px;opacity:.3}
.empty-state p{font-weight:700;font-size:.9rem}
.toast-custom{font-family:'Nunito',sans-serif!important;font-weight:700!important;border-radius:var(--radius)!important}
input[type="date"]{color-scheme:light}
</style>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>

 </head>
 <body class="h-full">
  <div id="app">
   <header class="header">
    <div class="header-left">
     <div class="logo-icon">
      W
     </div>
     <h1 id="appTitle">WOIPS</h1>
    </div><button class="gear-btn" onclick="toggleSidebar()"><i class="bi bi-gear-fill"></i></button>
   </header>
   <div class="main-content" id="mainContent"><!-- OLYMNOTES -->
    <div class="page active" id="page-notes">
     <div class="search-bar">
      <i class="bi bi-search search-icon"></i><input type="text" placeholder="Cari istilah..." oninput="renderNotes()">

    <div class="page" id="page-reels">

     </div>
     <div class="filter-row" id="reelsFilter"></div>
     <div class="stats-bar" id="reelsStats"></div>
     <div class="card-grid" id="reelsGrid"></div>
    </div><!-- OLYMAPS -->
    <div class="page" id="page-maps">
     <div class="search-bar">
      <i class="bi bi-search search-icon"></i><input type="text" placeholder="Cari roadmap..." oninput="renderMaps()">
     </div>
     <div class="filter-row" id="mapsFilter"></div>
     <div class="stats-bar" id="mapsStats"></div>
     <div id="mapsList"></div>
    </div><!-- OLYMPEDIA -->
    <div class="page" id="page-pedia">
     <div class="search-bar">
      <i class="bi bi-search search-icon"></i><input type="text" placeholder="Cari materi..." oninput="renderPedia()">

     <div class="filter-row" id="pediaFilter"></div>
     <div class="stats-bar" id="pediaStats"></div>
     <div id="pediaList"></div>

      <i class="bi bi-search search-icon"></i><input type="text" placeholder="Cari gambar..." oninput="renderPict()">
     </div>

     <div class="stats-bar" id="pictStats"></div>
     <div class="masonry" id="pictGrid"></div>
    </div>
   </div><button class="fab" id="fabBtn" onclick="openAddModal()"><i class="bi bi-plus-lg"></i></button>
   <nav class="bottom-nav"><button class="nav-item active" data-page="notes" onclick="switchPage('notes')"><i class="bi bi-journal-text"></i><span>Notes</span></button> <button class="nav-item" data-page="reels" onclick="switchPage('reels')"><i class="bi bi-camera-reels"></i><span>Reels</span></button> <button class="nav-item" data-page="maps" onclick="switchPage('maps')"><i class="bi bi-map"></i><span>Maps</span></button> <button class="nav-item" data-page="pedia" onclick="switchPage('pedia')"><i class="bi bi-collection"></i><span>Pedia</span></button> <button class="nav-item" data-page="pict" onclick="switchPage('pict')"><i class="bi bi-images"></i><span>Pict</span></button>
   </nav>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

   <div class="sidebar-item" onclick="exportData()">
    <i class="bi bi-download"></i>Ekspor JSON
   </div>
   <div class="sidebar-item" onclick="document.getElementById('importFile').click()">
    <i class="bi bi-upload"></i>Impor JSON

   </div>

    <i class="bi bi-book"></i>Dokumentasi
   </div>

    <i class="bi bi-globe"></i>Blog WOIPS
   </div>

    <i class="bi bi-info-circle"></i>Tentang

   <div class="lb-info">
    <h4 id="lbTitle"></h4>
    <p id="lbDesc"></p>
   </div><button class="lb-download" onclick="downloadLbImage()"><i class="bi bi-download"></i> Download</button>

   </div>

  <script>
const STORAGE_KEY='woips_v1';
let currentPage='notes';
let lbImages=[];let lbIndex=0;

// Default Data
const defaultData={
notes:[
{id:genId(),emoji:'🌍',title:'Atmosfer',subtitle:'Lapisan Gas Bumi',category:'Geografi',content:'<p>Atmosfer adalah lapisan gas yang menyelubungi Bumi. Terdiri dari <b>troposfer</b> (cuaca), <b>stratosfer</b> (ozon), <b>mesosfer</b>, <b>termosfer</b>, dan <b>eksosfer</b>.</p>',extra:'Ketebalan atmosfer mencapai ±480 km dari permukaan Bumi',image:'https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=400',bookmarked:false},
{id:genId(),emoji:'🪨',title:'Litosfer',subtitle:'Lapisan Batuan Bumi',category:'Geografi',content:'<p>Litosfer adalah lapisan terluar Bumi yang padat, terdiri dari <b>kerak bumi</b> dan bagian atas <b>mantel</b>. Litosfer terpecah menjadi <b>lempeng tektonik</b> yang bergerak.</p>',extra:'Ketebalan litosfer berkisar 70-250 km',image:'',bookmarked:false},
{id:genId(),emoji:'💧',title:'Hidrosfer',subtitle:'Seluruh Air di Bumi',category:'Geografi',content:'<p>Hidrosfer mencakup semua air di Bumi: <b>lautan</b> (97.5%), <b>es kutub</b>, <b>air tanah</b>, <b>sungai</b>, dan <b>danau</b>. Air tawar hanya 2.5% dari total.</p>',extra:'Siklus hidrologi menggerakkan air melalui evaporasi, kondensasi, dan presipitasi',image:'',bookmarked:false},
{id:genId(),emoji:'📈',title:'Inflasi',subtitle:'Kenaikan Harga Umum',category:'Ekonomi',content:'<p>Inflasi adalah kenaikan harga barang dan jasa secara <b>umum dan terus-menerus</b>. Diukur dengan <b>Indeks Harga Konsumen (IHK)</b>. Jenis: demand-pull, cost-push, dan built-in.</p>',extra:'Target inflasi Bank Indonesia: 2-4% per tahun',image:'',bookmarked:false},

function genId(){return 'id_'+Math.random().toString(36).substr(2,9)+Date.now().toString(36)}
function getData(){
let d=localStorage.getItem(STORAGE_KEY);
if(!d){localStorage.setItem(STORAGE_KEY,JSON.stringify(defaultData));return JSON.parse(JSON.stringify(defaultData))}
return JSON.parse(d);
}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function toast(msg,icon='success'){Swal.fire({toast:true,position:'top-end',icon,title:msg,showConfirmButton:false,timer:2000,timerProgressBar:true,customClass:{popup:'toast-custom'}})}

function getModal(){return bootstrap.Modal.getOrCreateInstance(document.getElementById('genericModal'))}
function showModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;getModal().show()}

// Page switching
function switchPage(p){
currentPage=p;
document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
document.getElementById('page-'+p).classList.add('active');
document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
document.querySelector(`.nav-item[data-page="${p}"]`).classList.add('active');
renderAll();
}

// Category colors
const catColors={Geografi:'#1CB0F6',Ekonomi:'#F97316',Sejarah:'#CE82FF',Sosiologi:'#58CC02'};
function catColor(c){return catColors[c]||'#999'}

// Filters
let activeFilters={notes:'Semua',reels:'Semua',maps:'Semua',pedia:'Semua',pict:'Semua'};

function renderFilters(containerId,items,key,page){
const cats=['Semua',...new Set(items.map(i=>i[key]))];
const c=document.getElementById(containerId);
c.innerHTML=cats.map(cat=>`<button class="pill ${activeFilters[page]===cat?'active':''}" onclick="activeFilters['${page}']='${cat}';renderAll()">${cat}</button>`).join('');
}

function filterItems(items,key,page,searchInput){
let f=items;
const q=searchInput?.value?.toLowerCase()||'';
if(activeFilters[page]!=='Semua')f=f.filter(i=>i[key]===activeFilters[page]);
if(q)f=f.filter(i=>(i.title||'').toLowerCase().includes(q)||(i.desc||i.subtitle||i.content||i.notes||'').toLowerCase().includes(q));
return f;
}

renderFilters('notesFilter',d.notes,'category','notes');

document.getElementById('notesStats').innerHTML=`<span class="stat-chip"><i class="bi bi-journal-text"></i>${items.length} istilah</span>`;
const g=document.getElementById('notesGrid');
if(!items.length){g.innerHTML='<div class="empty-state"><i class="bi bi-journal-text"></i><p>Belum ada istilah</p></div>';return}
g.innerHTML=items.map(n=>`
<div class="item-card" onclick="viewNote('${n.id}')">
<div class="cat-line" style="background:${catColor(n.category)}"></div>
<div class="emoji-big">${n.emoji}</div>

<p>${n.subtitle}</p>

<div class="actions-row">

<button class="icon-btn" onclick="event.stopPropagation();deleteItem('notes','${n.id}')"><i class="bi bi-trash"></i></button>

</div>`).join('');
}

// RENDER MAPS
function renderMaps(){
const d=getData();
const searchEl=document.querySelector('#page-maps .search-bar input');
renderFilters('mapsFilter',d.maps,'tag','maps');
const items=filterItems(d.maps,'tag','maps',searchEl);
// Sort: pinned first, then undone, then done
items.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(a.done?1:0)-(b.done?1:0));
const doneCount=items.filter(i=>i.done).length;
document.getElementById('mapsStats').innerHTML=`<span class="stat-chip"><i class="bi bi-map"></i>${items.length} roadmap</span><span class="stat-chip" style="background:var(--sec)"><i class="bi bi-check2-circle"></i>${doneCount} selesai</span>`;
const c=document.getElementById('mapsList');
if(!items.length){c.innerHTML='<div class="empty-state"><i class="bi bi-map"></i><p>Belum ada roadmap</p></div>';return}
const today=new Date().toISOString().split('T')[0];
c.innerHTML=items.map(m=>{
const overdue=!m.done&&m.deadline&&m.deadline<today;
return`<div class="maps-card ${m.done?'done-card':''}">
<div class="top-row">
<div class="check-box ${m.done?'done':''}" onclick="toggleDone('${m.id}')"><i class="bi bi-check-lg" style="display:${m.done?'block':'none'}"></i></div>
<div class="info" onclick="viewMap('${m.id}')" style="cursor:pointer">
<h3>${m.pinned?'<i class="bi bi-pin-fill" style="color:var(--pri)"></i> ':''}${m.title}</h3>
<span class="tag" style="background:${catColor(m.tag)}20;color:${catColor(m.tag)}">${m.tag}</span>
${m.deadline?`<span class="deadline ${overdue?'overdue':'ok'}" style="margin-left:6px"><i class="bi bi-calendar"></i> ${m.deadline}</span>`:''}
</div>
<div style="display:flex;gap:4px;flex-shrink:0">
<button class="icon-btn ${m.pinned?'pinned':''}" onclick="togglePin('${m.id}')"><i class="bi bi-pin${m.pinned?'-fill':''}"></i></button>
<button class="icon-btn" onclick="editMap('${m.id}')"><i class="bi bi-pencil"></i></button>
<button class="icon-btn" onclick="deleteItem('maps','${m.id}')"><i class="bi bi-trash"></i></button>
</div>
</div>
</div>`}).join('');
}

function viewMap(id){
const m=getData().maps.find(x=>x.id===id);if(!m)return;
const today=new Date().toISOString().split('T')[0];
const overdue=!m.done&&m.deadline&&m.deadline<today;
showModal(m.title,`
<h4 style="font-weight:800">${m.title}</h4>
<div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap">
<span class="tag" style="background:${catColor(m.tag)}20;color:${catColor(m.tag)};padding:4px 12px;border-radius:50px;font-weight:700">${m.tag}</span>
${m.deadline?`<span class="deadline ${overdue?'overdue':'ok'}" style="padding:4px 12px;border-radius:50px;font-weight:700"><i class="bi bi-calendar"></i> ${m.deadline}${overdue?' (Terlambat!)':''}</span>`:''}
${m.done?'<span style="background:#E0F7E0;color:#27AE60;padding:4px 12px;border-radius:50px;font-weight:700;font-size:.75rem">✅ Selesai</span>':''}

const fs=config.font_size||defaultConfig.font_size;

document.documentElement.style.setProperty('--bg',bg);
document.documentElement.style.setProperty('--card',sf);
document.documentElement.style.setProperty('--text',tx);
document.documentElement.style.setProperty('--pri',pr);
document.documentElement.style.setProperty('--sec',ac);
document.body.style.fontFamily=`${ff}, sans-serif`;
document.body.style.fontSize=fs+'px';
document.body.style.background=bg;
document.body.style.color=tx;
