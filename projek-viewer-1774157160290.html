  <style>
:root{
--pri:#F97316;--sec:#58CC02;--blu:#1CB0F6;--yel:#FFC800;--pur:#CE82FF;
--bg:#0F172A;--card:#1E293B;--card2:#334155;--txt:#F1F5F9;--txtsub:#94A3B8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.top-bar{background:linear-gradient(135deg,#1E293B 0%,#0F172A 100%);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;z-index:100}
.top-bar .logo{font-weight:900;font-size:1.4rem;background:linear-gradient(135deg,var(--pri),var(--yel));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.top-bar .logo span{font-size:.7rem;-webkit-text-fill-color:var(--txtsub);display:block;letter-spacing:2px;margin-top:-4px}
.gear-btn{background:none;border:none;color:var(--txtsub);font-size:1.3rem;cursor:pointer;transition:.3s}
.gear-btn:hover{color:var(--pri);transform:rotate(90deg)}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 80px;scroll-behavior:smooth}
.main-content::-webkit-scrollbar{width:4px}
.main-content::-webkit-scrollbar-thumb{background:var(--card2);border-radius:4px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,0.95);backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,0.06);z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:12px;cursor:pointer;transition:.2s;color:var(--txtsub);font-size:.65rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:none;background:none}
.nav-item i{font-size:1.2rem;transition:.2s}
.nav-item.active{color:var(--pri)}
.nav-item.active i{transform:scale(1.15)}
.nav-item:hover{color:var(--pri)}
.section{display:none;animation:fadeUp .3s ease}
.section.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.search-bar{position:relative;margin-bottom:10px}
.search-bar input{width:100%;background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:10px 16px 10px 40px;color:var(--txt);font-family:'Nunito',sans-serif;font-size:.9rem;outline:none;transition:.2s}
.search-bar input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(249,115,22,0.15)}
.search-bar i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--txtsub);font-size:1rem}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:5px 14px;border-radius:20px;background:var(--card);color:var(--txtsub);font-size:.75rem;font-weight:700;cursor:pointer;border:1px solid transparent;transition:.2s;flex-shrink:0}
.pill.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.pill:hover:not(.active){border-color:var(--pri);color:var(--pri)}
.stats{font-size:.75rem;color:var(--txtsub);margin-bottom:10px;font-weight:600}
.stats b{color:var(--pri)}
.card-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:576px){.card-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:992px){.card-grid{grid-template-columns:repeat(3,1fr)}}
.item-card{background:var(--card);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;border-bottom:3px solid var(--pri);position:relative;overflow:hidden}
.item-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.item-card .emoji{font-size:1.8rem}
.item-card h3{font-size:.95rem;font-weight:800;margin:6px 0 2px}
.item-card .sub{font-size:.75rem;color:var(--txtsub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-card .cat-badge{position:absolute;top:10px;right:10px;font-size:.6rem;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.item-card .actions{display:flex;gap:6px;margin-top:8px}
.item-card .actions button{background:var(--card2);border:none;color:var(--txtsub);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;font-size:.85rem}
.item-card .actions button:hover{background:var(--pri);color:#fff}
.item-card .actions button.bookmarked{color:var(--yel)}
.fab{position:fixed;bottom:76px;right:16px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--pri),#EA580C);color:#fff;border:none;font-size:1.5rem;cursor:pointer;z-index:999;box-shadow:0 4px 20px rgba(249,115,22,0.4);transition:.2s;display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(249,115,22,0.5)}
.modal-dark .modal-content{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:16px;color:var(--txt)}
.modal-dark .modal-header{border-bottom:1px solid rgba(255,255,255,0.06)}
.modal-dark .modal-footer{border-top:1px solid rgba(255,255,255,0.06)}
.modal-dark .btn-close{filter:invert(1);opacity:.5}
.modal-dark .form-control,.modal-dark .form-select{background:var(--bg);border:1px solid rgba(255,255,255,0.1);color:var(--txt);border-radius:10px}
.modal-dark .form-control:focus,.modal-dark .form-select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(249,115,22,0.15)}
.modal-dark .form-label{font-size:.8rem;font-weight:700;color:var(--txtsub)}
.highlight-box{background:rgba(249,115,22,0.08);border-left:3px solid var(--pri);border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0;font-size:.85rem}
.progress-mini{height:5px;border-radius:5px;background:var(--card2);overflow:hidden}
.progress-mini .bar{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--sec),var(--blu));transition:.3s}
.deadline-badge{font-size:.7rem;padding:2px 8px;border-radius:8px;font-weight:700}
.deadline-badge.overdue{background:rgba(239,68,68,0.15);color:#EF4444}
.deadline-badge.upcoming{background:rgba(249,115,22,0.15);color:var(--pri)}
.deadline-badge.ok{background:rgba(88,204,2,0.15);color:var(--sec)}
.done-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--txtsub);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.done-check.checked{background:var(--sec);border-color:var(--sec);color:#fff}
.map-card{background:var(--card);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:flex-start;transition:.2s;border-left:3px solid var(--pri)}
.map-card:hover{background:var(--card2)}
.map-card.done-card{opacity:.6}
.map-card.done-card h3{text-decoration:line-through}
.pedia-item{background:var(--card);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;transition:.2s}
.pedia-item:hover{background:var(--card2)}
.pedia-item .pe-emoji{font-size:1.6rem;flex-shrink:0}
.pedia-item .pe-info{flex:1;min-width:0}
.pedia-item h3{font-size:.9rem;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.masonry{columns:2;column-gap:10px}
@media(min-width:768px){.masonry{columns:3}}
.masonry .pict-card{break-inside:avoid;margin-bottom:10px;border-radius:14px;overflow:hidden;cursor:pointer;position:relative;background:var(--card)}
.masonry .pict-card img{width:100%;display:block;transition:.3s}
.masonry .pict-card:hover img{transform:scale(1.03)}
.masonry .pict-card .overlay{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,0.8));font-size:.75rem;font-weight:700}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:none;animation:fadeIn .2s}
.sidebar-overlay.show{display:block}
.sidebar{position:fixed;top:0;right:-300px;width:280px;height:100%;background:var(--card);z-index:2001;transition:.3s;overflow-y:auto;padding:20px;border-left:1px solid rgba(255,255,255,0.06)}
.sidebar.show{right:0}
.sidebar h5{font-weight:900;margin-bottom:16px;color:var(--pri)}
.sidebar .sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.2s;margin-bottom:4px;font-weight:700;font-size:.85rem;color:var(--txt);border:none;background:none;width:100%;text-align:left}
.sidebar .sb-item:hover{background:rgba(249,115,22,0.1);color:var(--pri)}
.sidebar .sb-item i{font-size:1.1rem;color:var(--pri);width:24px;text-align:center}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:3000;display:none;align-items:center;justify-content:center;flex-direction:column}
.lightbox.show{display:flex}
.lightbox img{max-width:90%;max-height:70%;object-fit:contain;border-radius:8px;transition:.3s;cursor:zoom-in}
.lightbox img.zoomed{max-width:150%;max-height:150%;cursor:zoom-out}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.lightbox .lb-nav:hover{background:var(--pri)}
.lightbox .lb-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer}
.lightbox .lb-info{color:#fff;text-align:center;margin-top:12px;font-size:.85rem;max-width:80%}
.lightbox .lb-dl{background:var(--pri);color:#fff;border:none;padding:6px 16px;border-radius:8px;font-weight:700;font-size:.8rem;cursor:pointer;margin-top:8px;transition:.2s}
.lightbox .lb-dl:hover{background:#EA580C}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.empty-state{text-align:center;padding:40px 20px;color:var(--txtsub)}
.empty-state i{font-size:3rem;margin-bottom:12px;opacity:.3}
.empty-state p{font-size:.9rem}
.cat-geo{border-color:var(--sec)!important}.cat-geo .cat-badge{background:rgba(88,204,2,0.15);color:var(--sec)}
.cat-eko{border-color:var(--blu)!important}.cat-eko .cat-badge{background:rgba(28,176,246,0.15);color:var(--blu)}
.cat-sej{border-color:var(--yel)!important}.cat-sej .cat-badge{background:rgba(255,200,0,0.15);color:var(--yel)}
.cat-sos{border-color:var(--pur)!important}.cat-sos .cat-badge{background:rgba(206,130,255,0.15);color:var(--pur)}
.pin-icon{color:var(--yel)!important}
</style>

// ====== DEFAULT DATA ======
const CATS = {Geografi:'geo',Ekonomi:'eko',Sejarah:'sej',Sosiologi:'sos'};
const CAT_COLORS = {geo:'var(--sec)',eko:'var(--blu)',sej:'var(--yel)',sos:'var(--pur)'};

function getDefaults(){return{
notes:[
{id:n(),emoji:'🌍',title:'Atmosfer',subtitle:'Lapisan udara Bumi',content:'<p>Atmosfer adalah lapisan gas yang menyelimuti Bumi. Terdiri dari troposfer, stratosfer, mesosfer, termosfer, dan eksosfer.</p><p>Troposfer adalah lapisan terendah tempat cuaca terjadi, dengan ketinggian sekitar 12 km.</p>',extra:'Komposisi: 78% Nitrogen, 21% Oksigen, 1% gas lain',cat:'Geografi',img:'https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=600',bookmarked:false},
{id:n(),emoji:'🪨',title:'Litosfer',subtitle:'Lapisan batuan Bumi',content:'<p>Litosfer adalah lapisan terluar Bumi yang terdiri dari kerak dan bagian atas mantel. Tebalnya 70-250 km.</p><p>Terbagi menjadi lempeng-lempeng tektonik yang terus bergerak.</p>',extra:'Pergerakan lempeng menyebabkan gempa bumi dan gunung berapi',cat:'Geografi',img:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600',bookmarked:false},
{id:n(),emoji:'💧',title:'Hidrosfer',subtitle:'Seluruh air di Bumi',content:'<p>Hidrosfer mencakup semua air di Bumi: lautan (97.5%), es kutub (1.7%), air tawar (0.8%).</p><p>Siklus hidrologi menghubungkan evaporasi, kondensasi, presipitasi, dan infiltrasi.</p>',extra:'Hanya 0.3% air di Bumi yang bisa langsung digunakan manusia',cat:'Geografi',img:'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600',bookmarked:false},
{id:n(),emoji:'📈',title:'Inflasi',subtitle:'Kenaikan harga umum',content:'<p>Inflasi adalah kenaikan harga barang/jasa secara umum dan terus-menerus dalam jangka waktu tertentu.</p><p>Diukur dengan Indeks Harga Konsumen (IHK). Jenis: demand-pull, cost-push, dan built-in inflation.</p>',extra:'Target inflasi BI: 2-4% per tahun',cat:'Ekonomi',img:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=600',bookmarked:false},
{id:n(),emoji:'⚖️',title:'Kelangkaan',subtitle:'Keterbatasan sumber daya',content:'<p>Kelangkaan terjadi karena kebutuhan manusia tidak terbatas sementara sumber daya terbatas.</p><p>Konsep dasar ekonomi: bagaimana mengalokasikan sumber daya langka untuk memenuhi kebutuhan.</p>',extra:'Biaya peluang (opportunity cost) muncul karena kelangkaan',cat:'Ekonomi',img:'https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?w=600',bookmarked:false},

function n(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

// ====== STATE ======
let data, activeTab='notes', activeFilters={notes:'Semua',reels:'Semua',maps:'Semua',pedia:'Semua',pict:'Semua'};
let lbPicts=[], lbIdx=0;

function loadData(){
  const s=localStorage.getItem('woips_v1');
  if(s){try{data=JSON.parse(s)}catch(e){data=getDefaults()}}
  else{data=getDefaults()}
  saveData();
}
function saveData(){localStorage.setItem('woips_v1',JSON.stringify(data))}

function toast(msg,icon='success'){
  Swal.fire({toast:true,position:'top-end',icon,title:msg,showConfirmButton:false,timer:2000,timerProgressBar:true,background:'#1E293B',color:'#F1F5F9',customClass:{popup:'border border-dark'}})
}

function catClass(cat){return 'cat-'+(CATS[cat]||'geo')}

// ====== NAV ======
function switchTab(tab,el){
  activeTab=tab;
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+tab).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  renderAll();
  document.getElementById('mainContent').scrollTop=0;
}

// ====== RENDER ======
function renderAll(){renderPills();renderGrid()}

function getUniqueCats(items){return['Semua',...[...new Set(items.map(i=>i.cat))].sort()]}

function renderPills(){
  ['notes','reels','maps','pedia','pict'].forEach(tab=>{
    const c=document.getElementById('pills-'+tab);
    const items=data[tab]||[];
    const cats=getUniqueCats(items);
    c.innerHTML=cats.map(cat=>`<div class="pill ${activeFilters[tab]===cat?'active':''}" onclick="setFilter('${tab}','${cat}')">${cat}</div>`).join('');
  });
}

function setFilter(tab,cat){activeFilters[tab]=cat;renderGrid()}

function getFiltered(tab){
  let items=data[tab]||[];
  const q=(document.querySelector('#sec-'+tab+' .search-bar input')||{}).value||'';
  if(q){const ql=q.toLowerCase();items=items.filter(i=>(i.title||'').toLowerCase().includes(ql)||(i.desc||'').toLowerCase().includes(ql)||(i.subtitle||'').toLowerCase().includes(ql)||(i.content||'').toLowerCase().includes(ql)||(i.notes||'').toLowerCase().includes(ql))}
  if(activeFilters[tab]&&activeFilters[tab]!=='Semua')items=items.filter(i=>i.cat===activeFilters[tab]);
  return items;
}

function filterItems(tab){renderGrid()}

function renderGrid(){
  renderNotes();renderReels();renderMaps();renderPedia();renderPict();
}

function renderNotes(){
  const items=getFiltered('notes');
  document.getElementById('stats-notes').innerHTML=`Menampilkan <b>${items.length}</b> dari ${data.notes.length} istilah`;
  const g=document.getElementById('grid-notes');
  if(!items.length){g.innerHTML=emptyHTML('Tidak ada istilah ditemukan');return}
  g.innerHTML=items.map(i=>`
    <div class="item-card ${catClass(i.cat)}" onclick="viewNote('${i.id}')">
      <span class="cat-badge">${i.cat}</span>
      <div class="emoji">${i.emoji||'📝'}</div>
      <h3>${esc(i.title)}</h3>
      <div class="sub">${esc(i.subtitle)}</div>
      <div class="actions" onclick="event.stopPropagation()">
        <button onclick="editItem('notes','${i.id}')" title="Edit"><i class="bi bi-pencil"></i></button>
        <button onclick="deleteItem('notes','${i.id}')" title="Hapus"><i class="bi bi-trash"></i></button>
        <button class="${i.bookmarked?'bookmarked':''}" onclick="toggleBookmark('notes','${i.id}')" title="Bookmark"><i class="bi bi-${i.bookmarked?'bookmark-fill':'bookmark'}"></i></button>
      </div>
    </div>`).join('');
}

function renderReels(){
  const items=getFiltered('reels');
  document.getElementById('stats-reels').innerHTML=`Menampilkan <b>${items.length}</b> dari ${data.reels.length} video`;
  const g=document.getElementById('grid-reels');
  if(!items.length){g.innerHTML=emptyHTML('Tidak ada video ditemukan');return}
  g.innerHTML=items.map(i=>`
    <div class="item-card ${catClass(i.cat)}" onclick="viewReel('${i.id}')">
      <span class="cat-badge">${i.cat}</span>
      <div class="emoji">🎬</div>
      <h3>${esc(i.title)}</h3>
      <div class="sub">${esc(i.desc)}</div>
      <div class="actions" onclick="event.stopPropagation()">
        <button onclick="editItem('reels','${i.id}')" title="Edit"><i class="bi bi-pencil"></i></button>
        <button onclick="deleteItem('reels','${i.id}')" title="Hapus"><i class="bi bi-trash"></i></button>
        <button class="${i.bookmarked?'bookmarked':''}" onclick="toggleBookmark('reels','${i.id}')" title="Bookmark"><i class="bi bi-${i.bookmarked?'bookmark-fill':'bookmark'}"></i></button>
      </div>
    </div>`).join('');
}

function renderMaps(){
  const items=getFiltered('maps');
  // Sort: pinned first, then by deadline
  items.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||new Date(a.deadline)-new Date(b.deadline));
  document.getElementById('stats-maps').innerHTML=`Menampilkan <b>${items.length}</b> dari ${data.maps.length} item`;
  const g=document.getElementById('grid-maps');
  if(!items.length){g.innerHTML=emptyHTML('Tidak ada roadmap ditemukan');return}
  const today=new Date().toISOString().split('T')[0];
  g.innerHTML=items.map(i=>{
    const overdue=!i.done&&i.deadline<today;
    const dlClass=i.done?'ok':(overdue?'overdue':'upcoming');
    const dlLabel=i.done?'Selesai':(overdue?'Terlambat':i.deadline);
    return`<div class="map-card ${i.done?'done-card':''} ${catClass(i.cat)}" style="border-left-color:${CAT_COLORS[CATS[i.cat]]||'var(--pri)'}">
      <button class="done-check ${i.done?'checked':''}" onclick="toggleDone('${i.id}')">${i.done?'<i class="bi bi-check"></i>':''}</button>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <h3 style="font-size:.9rem;font-weight:800;margin:0">${esc(i.title)}</h3>
          ${i.pinned?'<i class="bi bi-pin-fill pin-icon" style="font-size:.8rem"></i>':''}
          <span class="deadline-badge ${dlClass}">${dlLabel}</span>
        </div>
        <div style="font-size:.75rem;color:var(--txtsub);margin-top:2px">${esc(i.cat)} ${i.notes?'• '+esc(i.notes.slice(0,60))+'...':''}</div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0">
        <button class="done-check" style="border-color:var(--txtsub);width:28px;height:28px" onclick="editItem('maps','${i.id}')" title="Edit"><i class="bi bi-pencil" style="font-size:.7rem"></i></button>
        <button class="done-check" style="border-color:var(--txtsub);width:28px;height:28px" onclick="togglePin('${i.id}')" title="Pin"><i class="bi bi-pin${i.pinned?'-fill':''}" style="font-size:.7rem;${i.pinned?'color:var(--yel)':''}"></i></button>
        <button class="done-check" style="border-color:var(--txtsub);width:28px;height:28px" onclick="deleteItem('maps','${i.id}')" title="Hapus"><i class="bi bi-trash" style="font-size:.7rem"></i></button>
      </div>
    </div>`}).join('');
}

function renderPedia(){
  const items=getFiltered('pedia');
  document.getElementById('stats-pedia').innerHTML=`Menampilkan <b>${items.length}</b> dari ${data.pedia.length} materi`;
  const g=document.getElementById('grid-pedia');
  if(!items.length){g.innerHTML=emptyHTML('Tidak ada materi ditemukan');return}
  g.innerHTML=items.map(i=>{
    const pct=i.pages?Math.round((i.progress/i.pages)*100):0;
    return`<div class="pedia-item" onclick="viewPedia('${i.id}')" style="cursor:pointer">
      <div class="pe-emoji">${i.emoji||'📄'}</div>
      <div class="pe-info">
        <h3>${esc(i.title)}</h3>
        <div style="font-size:.7rem;color:var(--txtsub)">${i.cat} • ${i.progress}/${i.pages} hal</div>
        <div class="progress-mini" style="margin-top:4px"><div class="bar" style="width:${pct}%"></div></div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0" onclick="event.stopPropagation()">
        <button class="done-check ${i.bookmarked?'bookmarked':''}" style="width:28px;height:28px;border-color:${i.bookmarked?'var(--yel)':'var(--txtsub)'}" onclick="toggleBookmark('pedia','${i.id}')"><i class="bi bi-${i.bookmarked?'bookmark-fill':'bookmark'}" style="font-size:.7rem;${i.bookmarked?'color:var(--yel)':''}"></i></button>
        <button class="done-check" style="width:28px;height:28px;border-color:var(--txtsub)" onclick="editItem('pedia','${i.id}')"><i class="bi bi-pencil" style="font-size:.7rem"></i></button>
        <button class="done-check" style="width:28px;height:28px;border-color:var(--txtsub)" onclick="deleteItem('pedia','${i.id}')"><i class="bi bi-trash" style="font-size:.7rem"></i></button>
      </div>
    </div>`}).join('');
}

function renderPict(){
  const items=getFiltered('pict');
  lbPicts=items;
  document.getElementById('stats-pict').innerHTML=`Menampilkan <b>${items.length}</b> dari ${data.pict.length} gambar`;
  const g=document.getElementById('grid-pict');
  if(!items.length){g.innerHTML=emptyHTML('Tidak ada gambar ditemukan');return}
  g.innerHTML=items.map((i,idx)=>`
    <div class="pict-card" onclick="openLightbox(${idx})">
      <img src="${esc(i.img)}" alt="${esc(i.title)}" loading="lazy" onerror="this.style.background='linear-gradient(135deg,var(--card),var(--card2))';this.style.minHeight='120px';this.alt='Gambar tidak tersedia'">
      <div class="overlay">${esc(i.title)}</div>
    </div>`).join('');
}

function emptyHTML(msg){return`<div class="empty-state"><i class="bi bi-inbox"></i><p>${msg}</p></div>`}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ====== VIEWERS ======
function viewNote(id){
  const i=data.notes.find(x=>x.id===id);if(!i)return;
  const gm=new bootstrap.Modal(document.getElementById('genericModal'));
  document.getElementById('gmTitle').textContent=i.title;
  document.getElementById('gmBody').innerHTML=`
    <div style="text-align:center;font-size:3rem;margin-bottom:8px">${i.emoji||'📝'}</div>
    <h4 style="text-align:center;font-weight:900">${esc(i.title)}</h4>
    <p style="text-align:center;color:var(--txtsub);font-size:.85rem">${esc(i.subtitle)}</p>
    <div style="margin:16px 0;font-size:.9rem;line-height:1.7">${i.content}</div>
    ${i.extra?`<div class="highlight-box"><strong>💡 Info Tambahan:</strong><br>${esc(i.extra)}</div>`:''}
    ${i.img?`<img src="${esc(i.img)}" alt="${esc(i.title)}" loading="lazy" style="width:100%;border-radius:10px;margin-top:12px" onerror="this.style.display='none'">`:''}`;
  document.getElementById('gmFooter').innerHTML=`
    <button class="btn btn-sm btn-outline-light" onclick="copyText('${id}')"><i class="bi bi-clipboard"></i> Copy</button>

function copyText(id){
  const i=data.notes.find(x=>x.id===id);if(!i)return;
  const tmp=document.createElement('div');tmp.innerHTML=i.content;
  const txt=`${i.title}\n${i.subtitle}\n\n${tmp.textContent}\n\n${i.extra||''}`;
  navigator.clipboard.writeText(txt).then(()=>toast('Teks disalin!')).catch(()=>toast('Gagal menyalin','error'));
}

function viewReel(id){

  gm.show();
}

function viewPedia(id){
  const i=data.pedia.find(x=>x.id===id);if(!i)return;
  const pct=i.pages?Math.round((i.progress/i.pages)*100):0;
  const gm=new bootstrap.Modal(document.getElementById('genericModal'));
  document.getElementById('gmTitle').textContent=i.title;
  document.getElementById('gmBody').innerHTML=`
    <div style="position:relative;padding-bottom:80%;height:0;border-radius:10px;overflow:hidden;background:var(--bg)">
      <iframe src="https://drive.google.com/file/d/${esc(i.driveId)}/preview" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allow="autoplay"></iframe>

function savePediaProgress(id){
  const i=data.pedia.find(x=>x.id===id);if(!i)return;

function saveFormItem(){
  const tab=editingTab;
  const t=document.getElementById('f_title');
  if(t&&!t.value.trim()){toast('Judul wajib diisi','warning');return}

  let item;
  if(editingId){item=data[tab].find(x=>x.id===editingId);if(!item)return}
  else{item={id:n()};data[tab].push(item)}

  if(tab==='notes'){
    item.emoji=document.getElementById('f_emoji').value;
    item.title=document.getElementById('f_title').value;
    item.subtitle=document.getElementById('f_subtitle').value;
    item.content=document.getElementById('f_content').value;
    item.extra=document.getElementById('f_extra').value;
    item.cat=document.getElementById('f_cat').value;
    item.img=document.getElementById('f_img').value;
    if(!editingId)item.bookmarked=false;
  } else if(tab==='reels'){
    item.title=document.getElementById('f_title').value;
    item.desc=document.getElementById('f_desc').value;
    item.url=document.getElementById('f_url').value;
    item.cat=document.getElementById('f_cat').value;
    if(!editingId)item.bookmarked=false;
  } else if(tab==='maps'){
    item.title=document.getElementById('f_title').value;
    item.cat=document.getElementById('f_cat').value;
    item.deadline=document.getElementById('f_deadline').value;
    item.notes=document.getElementById('f_notes').value;
    item.link=document.getElementById('f_link').value;
    if(!editingId){item.pinned=false;item.done=false}
  } else if(tab==='pedia'){
    item.emoji=document.getElementById('f_emoji').value;
    item.title=document.getElementById('f_title').value;
    item.cat=document.getElementById('f_cat').value;
    item.driveId=document.getElementById('f_driveId').value;
    item.pages=parseInt(document.getElementById('f_pages').value)||100;
    if(!editingId){item.progress=0;item.bookmarked=false}
  } else if(tab==='pict'){
    item.title=document.getElementById('f_title').value;
    item.desc=document.getElementById('f_desc').value;
    item.img=document.getElementById('f_img').value;
    item.cat=document.getElementById('f_cat').value;
  }

  saveData();renderAll();
  bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
  toast(editingId?'Item diperbarui!':'Item ditambahkan!');
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      if(d.notes&&d.reels&&d.maps&&d.pedia&&d.pict){
        data=d;saveData();renderAll();toast('Data diimpor!');toggleSidebar();
      }else{toast('Format file tidak valid','error')}
    }catch(err){toast('Gagal membaca file','error')}
  };
  reader.readAsText(file);e.target.value='';
}
