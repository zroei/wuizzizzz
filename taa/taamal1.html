<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>SFX Player • Kelompok 1 Taamal 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #0b0e14 0%, #1a1f2a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .player-wrapper {
      max-width: 1300px;
      width: 100%;
      background: rgba(24, 28, 40, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 56px;
      padding: 32px 28px 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06);
      transition: all 0.2s;
    }
    h1 {
      color: #f2eee9;
      font-weight: 500;
      font-size: 2rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      padding-left: 8px;
    }
    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      background: #2c3449;
      padding: 6px 20px;
      border-radius: 60px;
      color: #bcc6dd;
      letter-spacing: 0.3px;
    }
    .loop-toggle {
      margin-left: auto;
      background: #262e42;
      border: 1px solid #3f4a62;
      padding: 10px 28px;
      border-radius: 60px;
      color: #d6deec;
      font-weight: 500;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      user-select: none;
    }
    .loop-toggle.active {
      background: #3d4f73;
      border-color: #8aa3d4;
      box-shadow: 0 0 20px #4a6b9e66;
      color: white;
    }
    .loop-toggle .indicator {
      width: 22px;
      height: 22px;
      border-radius: 30px;
      background: #4f5a74;
      transition: 0.2s;
    }
    .loop-toggle.active .indicator {
      background: #aac4ff;
      box-shadow: 0 0 16px #6a8fd0;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
      margin-top: 16px;
    }
    .sound-card {
      background: #1e2437;
      border-radius: 32px;
      padding: 20px 14px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.6);
      border: 1px solid #323b52;
      transition: transform 0.15s ease, border-color 0.2s, box-shadow 0.3s;
      cursor: default;
    }
    .sound-card:hover {
      border-color: #6a7da5;
      transform: translateY(-6px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.8);
    }
    .sound-card .label {
      font-weight: 600;
      color: #f0f4ff;
      font-size: 1rem;
      line-height: 1.3;
      margin-bottom: 4px;
      min-height: 2.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }
    .sound-card .sub {
      font-size: 0.7rem;
      color: #a3b1d0;
      background: #2b344b;
      padding: 4px 14px;
      border-radius: 30px;
      margin-bottom: 16px;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 4px;
    }
    .ctrl-btn {
      background: #2c354d;
      border: none;
      border-radius: 60px;
      padding: 10px 0;
      flex: 1;
      font-weight: 600;
      font-size: 0.85rem;
      color: #d1dcee;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.12s;
      box-shadow: inset 0 -3px 0 #12171f;
      cursor: pointer;
      border: 1px solid #3f4a62;
      min-width: 50px;
    }
    .ctrl-btn:active {
      transform: scale(0.94);
      box-shadow: inset 0 2px 6px #0b0e14;
    }
    .ctrl-btn.play-btn.playing {
      background: #3e5d83;
      border-color: #7f9fd0;
      color: white;
      box-shadow: 0 0 20px #2d4a7a77;
    }
    .ctrl-btn.loop-btn {
      flex: 0.6;
      background: #252e44;
      border-color: #3b455e;
      font-size: 1.1rem;
    }
    .ctrl-btn.loop-btn.active-loop {
      background: #3a507a;
      border-color: #7f9fd0;
      color: #d4e2ff;
      box-shadow: 0 0 14px #3b5f8a66;
    }
    .ctrl-btn i {
      font-style: normal;
      font-size: 1rem;
    }
    .status-bar {
      margin-top: 34px;
      padding: 12px 22px;
      background: #171d29;
      border-radius: 60px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      color: #b2bed9;
      font-size: 0.9rem;
      border: 1px solid #2f3850;
    }
    .status-bar .now-playing {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .status-bar .now-playing span {
      color: #e3eafb;
      font-weight: 500;
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-bar .badge-loop {
      background: #242d44;
      padding: 6px 20px;
      border-radius: 40px;
      font-size: 0.8rem;
      border: 1px solid #3f4a62;
    }
    .badge-loop.active {
      background: #2c4066;
      border-color: #7f9fd0;
      color: #ceddff;
    }
    @media (max-width: 680px) {
      .player-wrapper { padding: 20px 14px; }
      h1 { font-size: 1.5rem; }
      .loop-toggle { padding: 6px 16px; font-size: 0.8rem; gap: 8px; }
      .grid-container { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
    }
    @media (max-width: 480px) {
      .grid-container { grid-template-columns: 1fr 1fr; gap: 12px; }
      .sound-card { padding: 14px 8px; }
      .ctrl-btn { font-size: 0.7rem; padding: 8px 0; }
      .ctrl-btn.loop-btn { flex: 0.5; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
<div class="player-wrapper" role="main">
  <h1>
    🎭 SFX Teatrikal
    <small>Kelompok 1 • Taamal 2026</small>
    <div id="loopToggle" class="loop-toggle" role="button" tabindex="0" aria-label="Toggle loop global">
      <span>🔁 Global Loop</span>
      <span class="indicator" id="loopIndicator"></span>
    </div>
  </h1>

  <div class="grid-container" id="soundGrid"></div>

  <div class="status-bar">
    <div class="now-playing">
      <span>▶</span>
      <span id="nowPlayingLabel">Belum diputar</span>
    </div>
    <div class="badge-loop" id="loopStatusBadge">⏹ loop off</div>
  </div>
</div>

<script>
  (function() {
    // Daftar SFX sesuai urutan (judul + url) 
    const soundList = [
      { title: "🔴 BACKSOUND UTAMA", subtitle: "instrumen", url: "https://www.cloudsky.biz.id/api/file/backsound-primary-taamal26.mp3" },
      { title: "🔴 KING NASIR", subtitle: "CLOSING", url: "https://www.cloudsky.biz.id/api/file/kingnasir.mp3" },
      { title: "🔴 PITHEK MBENGOK", subtitle: "TMBHN", url: "https://www.myinstants.com/media/sounds/chicken-on-tree-screaming.mp3" },
      { title: "🦗 Suasana Garing", subtitle: "Jangkrik", url: "https://www.myinstants.com/media/sounds/awkward-cricket-silence.mp3" },
      { title: "🐔 Ayam Berkokok", subtitle: "Nge-lag", url: "https://www.myinstants.com/media/sounds/rooster-crow.mp3" },
      { title: "👊 Gebluk / Punch", subtitle: "🍗 Ayam Geprek", url: "https://www.myinstants.com/media/sounds/punch-sound-effect-meme.mp3" },
      { title: "🎥 Record Scratch", subtitle: "Pindah topik", url: "https://www.myinstants.com/media/sounds/record-scratch-2.mp3" },
      { title: "🐮 Sapi / Kambing", subtitle: "Peternakan", url: "https://www.myinstants.com/media/sounds/lamb-mbek-huntswomen.mp3" },
      { title: "🗣️Desisan Fah", subtitle: "Reaksi jijik", url: "https://www.myinstants.com/media/sounds/fahhhhhhhhhhhhhh.mp3" },
      { title: "🚨Buzzer Error", subtitle: "Salah konsep", url: "https://www.myinstants.com/media/sounds/erro.mp3" },
      { title: "🐐Kambing Ngamuk", subtitle: "Kabur", url: "https://www.myinstants.com/media/sounds/goat-sream.mp3" },
      { title: "👓 Kaca Pecah", subtitle: "Potong keramik", url: "https://www.myinstants.com/media/sounds/glass-smash.mp3" },
      { title: "💥 Vine Boom", subtitle: "Ledakan kartun", url: "https://www.myinstants.com/media/sounds/vine-boom.mp3" },
      { title: "🪈 Metal Pipe", subtitle: "Tusuk linggis", url: "https://www.myinstants.com/media/sounds/metal-pipe-clang.mp3" },
      { title: "💦 Cipratan Air", subtitle: "Mandi sapi", url: "https://www.myinstants.com/media/sounds/water-for-drama.mp3" },
      { title: "😭 Sad Violin", subtitle: "Adegan tragis", url: "https://www.myinstants.com/media/sounds/tf_nemesis.mp3" },
      { title: "😶Tamatlah sudah", subtitle: "Closing Punchline", url: "https://www.myinstants.com/media/sounds/tamatlah-sudah.mp3" },
      { title: "🎭Kocak komedi", subtitle: "Indian song", url: "https://www.myinstants.com/media/sounds/indian-song.mp3" },
      { title: "🔒Directed by", subtitle: "Robert B. Weide", url: "https://www.myinstants.com/media/sounds/directed-by-robert-b_voI2Z4T.mp3" }
    ];

    const grid = document.getElementById('soundGrid');
    const nowPlayingLabel = document.getElementById('nowPlayingLabel');
    const loopStatusBadge = document.getElementById('loopStatusBadge');
    const loopToggle = document.getElementById('loopToggle');
    const loopIndicator = document.getElementById('loopIndicator');

    // ----- state -----
    let currentAudio = null;         // Audio object yang sedang diputar
    let currentIndex = -1;           // index soundList
    let isGlobalLoop = false;        // global loop (semua audio)
    // cache untuk menyimpan audio element per index (supaya gak reload terus)
    const audioCache = new Map();     // key: index, value: { audio, loaded }

    // ----- fungsi update UI global loop -----
    function updateGlobalLoopUI() {
      if (isGlobalLoop) {
        loopToggle.classList.add('active');
        loopIndicator.style.background = '#aac4ff';
        loopStatusBadge.textContent = '🔁 loop on';
        loopStatusBadge.classList.add('active');
      } else {
        loopToggle.classList.remove('active');
        loopIndicator.style.background = '#4f5a74';
        loopStatusBadge.textContent = '⏹ loop off';
        loopStatusBadge.classList.remove('active');
      }
      // jika ada audio aktif, set loop property sesuai global
      if (currentAudio) {
        currentAudio.loop = isGlobalLoop;
      }
      // update semua tombol loop di card (tampilkan state aktif)
      document.querySelectorAll('.loop-btn').forEach((btn, idx) => {
        // kita set class aktif berdasarkan isGlobalLoop (karena global loop mempengaruhi semua)
        // tapi tombol per-card menampilkan loop state global (karena kita pakai 1 global)
        if (isGlobalLoop) {
          btn.classList.add('active-loop');
          btn.textContent = '🔁';
        } else {
          btn.classList.remove('active-loop');
          btn.textContent = '↺';
        }
      });
    }

    // toggle global loop
    function toggleGlobalLoop() {
      isGlobalLoop = !isGlobalLoop;
      updateGlobalLoopUI();
      if (currentAudio) {
        currentAudio.loop = isGlobalLoop;
      }
    }

    // ----- stop audio saat ini (tanpa reset tombol) -----
    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio.loop = false;
        currentAudio = null;
        currentIndex = -1;
      }
      // reset tombol play di semua card
      document.querySelectorAll('.play-btn').forEach(btn => {
        btn.classList.remove('playing');
        btn.innerHTML = '▶ Play';
      });
      nowPlayingLabel.textContent = 'Berhenti';
    }

    // ----- main play function dengan cache -----
    function playSound(index) {
      const sound = soundList[index];
      if (!sound) return;

      // jika audio yang sama sedang diputar -> pause
      if (currentAudio && currentIndex === index && !currentAudio.paused) {
        currentAudio.pause();
        document.querySelectorAll('.play-btn').forEach(btn => btn.classList.remove('playing'));
        nowPlayingLabel.textContent = '⏸ dijeda';
        // update tombol play di card ini
        const playBtn = document.querySelector(`.play-btn[data-index="${index}"]`);
        if (playBtn) {
          playBtn.classList.remove('playing');
          playBtn.innerHTML = '▶ Play';
        }
        return;
      }

      // jika ada audio lain, stop dulu
      if (currentAudio) {
        stopCurrentAudio();
      }

      // cek cache
      let cached = audioCache.get(index);
      let audio;

      if (cached) {
        audio = cached.audio;
        // reset state
        audio.pause();
        audio.currentTime = 0;
        audio.loop = isGlobalLoop;
      } else {
        // buat audio baru & cache
        audio = new Audio(sound.url);
        audio.preload = 'auto';
        audio.loop = isGlobalLoop;
        // simpan di cache
        audioCache.set(index, { audio, loaded: false });
        // event loadeddata untuk tandai loaded
        audio.addEventListener('loadeddata', function() {
          const entry = audioCache.get(index);
          if (entry) entry.loaded = true;
        });
        // jika error, hapus dari cache biar bisa retry nanti
        audio.addEventListener('error', function(e) {
          audioCache.delete(index);
          console.warn('Error load/cache audio:', sound.url);
        });
      }

      // event ended (hanya jika loop off)
      audio.removeEventListener('ended', handleEnded);
      audio.addEventListener('ended', handleEnded);

      function handleEnded() {
        if (!isGlobalLoop) {
          // reset tombol play
          document.querySelectorAll('.play-btn').forEach(btn => btn.classList.remove('playing'));
          nowPlayingLabel.textContent = 'Selesai';
          currentAudio = null;
          currentIndex = -1;
        }
        // jika global loop on, biarkan dia loop (otomatis)
      }

      // mulai play
      audio.play().catch(err => {
        console.warn('Play gagal:', err);
        nowPlayingLabel.textContent = '⛔ Gagal putar';
        document.querySelectorAll('.play-btn').forEach(btn => btn.classList.remove('playing'));
        currentAudio = null;
        currentIndex = -1;
        // hapus cache biar coba lagi nanti
        audioCache.delete(index);
      });

      // simpan referensi
      currentAudio = audio;
      currentIndex = index;

      // update tombol play semua card
      document.querySelectorAll('.play-btn').forEach((btn, i) => {
        btn.classList.remove('playing');
        if (i === index) {
          btn.classList.add('playing');
          btn.innerHTML = '⏸ Pause';
        } else {
          btn.innerHTML = '▶ Play';
        }
      });

      // update label
      nowPlayingLabel.textContent = `${sound.title} • ${sound.subtitle}`;
    }

    // ----- render grid dengan tombol play + loop per card -----
    function renderGrid() {
      grid.innerHTML = '';
      soundList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'sound-card';

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = item.title;

        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = item.subtitle;

        const controls = document.createElement('div');
        controls.className = 'controls';

        // tombol play
        const playBtn = document.createElement('button');
        playBtn.className = 'ctrl-btn play-btn';
        playBtn.setAttribute('data-index', idx);
        playBtn.innerHTML = '▶ Play';

        // tombol loop per card (toggle loop global sebenarnya, karena kita pakai 1 global)
        const loopBtn = document.createElement('button');
        loopBtn.className = 'ctrl-btn loop-btn';
        loopBtn.setAttribute('data-index', idx);
        loopBtn.textContent = isGlobalLoop ? '🔁' : '↺';
        if (isGlobalLoop) loopBtn.classList.add('active-loop');

        // event play
        playBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          const index = parseInt(this.getAttribute('data-index'), 10);
          playSound(index);
        });

        // event loop (toggle global)
        loopBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleGlobalLoop();
          // update tampilan tombol loop di semua card (sudah di handle di updateGlobalLoopUI)
        });

        controls.appendChild(playBtn);
        controls.appendChild(loopBtn);
        card.appendChild(label);
        card.appendChild(sub);
        card.appendChild(controls);
        grid.appendChild(card);
      });
    }

    // ----- inisialisasi event global loop -----
    loopToggle.addEventListener('click', toggleGlobalLoop);
    loopToggle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleGlobalLoop();
      }
    });

    // ----- init -----
    renderGrid();
    updateGlobalLoopUI();

    // cleanup sebelum unload
    window.addEventListener('beforeunload', function() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      // hapus cache untuk release memory (optional)
      audioCache.clear();
    });

    console.log('🎵 SFX Player dengan cache & kontrol per kartu siap!');
  })();
</script>
</body>
</html>
